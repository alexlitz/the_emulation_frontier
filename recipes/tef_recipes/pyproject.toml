[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-recipes"
version = "0.1.0"
description = "Build stage of the Emulation Frontier recipes: the universal host, the exact-host constructions and the tef-ucore exporter"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.57", "numpy", "safetensors", "huggingface_hub"]

[tool.setuptools]
packages = ["tef_recipes"]
